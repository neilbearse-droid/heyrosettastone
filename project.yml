# XcodeGen manifest. Generate the Xcode project with:  xcodegen generate
name: Rosetta
options:
  bundleIdPrefix: family.rosetta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0

targets:
  Rosetta:
    type: application
    platform: iOS
    sources:
      - App
      - Board
      - Capture
      - Model
      - Data
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rosetta
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: >-
          Rosetta listens on this device, only while the green indicator is
          showing, so your family can save and label the sounds he makes.
          Audio never leaves this device.
        NSCameraUsageDescription: >-
          Used to photograph his real objects (his cup, his banana) for the
          board and dictionary. Photos stay on this device.
        NSPhotoLibraryUsageDescription: >-
          Used to pick existing photos of his real objects for the board and
          dictionary. Photos stay on this device.
        UIBackgroundModes:
          - audio
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: true
        # Principle 7: no network entitlement. Nothing here requests one, and
        # no networking framework is linked. Keep it that way.
        CODE_SIGN_ENTITLEMENTS: ""

  RosettaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Rosetta
    settings:
      base:
        SWIFT_VERSION: "5.10"

schemes:
  Rosetta:
    build:
      targets:
        Rosetta: all
    test:
      targets:
        - RosettaTests
